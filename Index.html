<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#61d4ff,#bdefff);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:92%;
max-width:420px;
background:#fff;
border-radius:25px;
padding:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.2);
animation:zoom 1s;
position:relative;
z-index:2;
}

@keyframes zoom{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

.dora{
width:130px;
animation:jump 2s infinite;
}

@keyframes jump{
50%{
transform:translateY(-10px);
}
}

h1{
color:#0099ff;
margin:10px 0;
font-size:28px;
}

p{
color:#444;
font-size:16px;
line-height:1.7;
margin-bottom:15px;
}

.slider{
width:100%;
height:330px;
overflow:hidden;
border-radius:18px;
}

.slider img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.slider img.active{
display:block;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

button{
margin-top:18px;
padding:13px 28px;
font-size:18px;
background:#0099ff;
color:white;
border:none;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#0077dd;
}

.heart{
position:absolute;
bottom:-40px;
font-size:24px;
animation:fly 6s linear infinite;
opacity:.8;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<img class="dora"
src="https://upload.wikimedia.org/wikipedia/en/0/05/Doraemon_character.png">

<h1>Happy Friendship Day 💙</h1>

<p>
Some friendships are not made by blood,<br>
they are made by heart. ❤️<br><br>

Thank you for being the reason behind so many smiles,
countless memories and endless happiness.

Forever Best Friends 💙
</p>

<div class="slider">
<img class="active" src="11421.jpg">
<img src="11422.jpg">
<img src="11423.jpg">
<img src="11425.jpg">
</div>

<button onclick="surprise()">
🎁 Open Surprise
</button>

<audio id="music" autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8f61dcb08b.mp3?filename=happy-day-112194.mp3">
</audio>

<script>

function surprise(){
alert("💙 Happy Friendship Day 💙\n\nYou are one of the most precious people in my life.");
}

let imgs=document.querySelectorAll(".slider img");
let i=0;setInterval(()=>{
imgs[i].classList.remove("active");
i=(i+1)%imgs.length;
imgs[i].classList.add("active");
},2500);

setInterval(()=>{

let h=document.createElement("div");
h.className="heart";

let icons=["💙","✨","🤍","💖"];
h.innerHTML=icons[Math.floor(Math.random()*icons.length)];

h.style.left=Math.random()*100+"vw";
h.style.fontSize=(18+Math.random()*20)+"px";
h.style.animationDuration=(4+Math.random()*3)+"s";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},7000);

},300);

// Welcome message after page loads
setTimeout(()=>{
alert("💙 Welcome 💙\n\nHappy Friendship Day!\nMay our friendship always stay as beautiful as Doraemon & Nobita's.");
},800);

</script>

</body>
</html>
